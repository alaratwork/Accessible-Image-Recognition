<text x="56" y="126" font-size="42" font-weight="bold" fill="#1F2933">Who Calls What</text>
<text x="56" y="166" font-size="17" fill="#6B7A87">Seven controllers. Every algorithm lives in model/, every output in view/, and no controller calls another.</text>
<text x="56" y="192" font-size="15" fill="#6B7A87">A filled dot means that controller imports and calls that function directly.</text>
