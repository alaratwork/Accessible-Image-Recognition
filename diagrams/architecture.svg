<rect x="40" y="992" width="1588" height="104" rx="8" fill="#FBE6E3"/>
<text x="60" y="1018" font-size="14.5" font-weight="bold" fill="#8E2F27">Three public functions exist with no caller — deliberately, not by oversight</text>
<text x="60" y="1044" font-size="14" fill="#1F2933">announce_top_k — the confidence-aware wording in announce_match already covers the single-result case</text>
<text x="60" y="1066" font-size="14" fill="#1F2933">predict_from_path — segmentation hands prediction an in-memory crop, so no controller needs the file-based form</text>
<text x="60" y="1088" font-size="14" fill="#1F2933">build_transform — called inside model/, by load_item_data and predict_from_image, never by a controller</text>
